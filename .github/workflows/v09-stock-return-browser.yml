name: V09 independent stock return Chrome (validation only)
on:
  push:
    branches: [validation/v09-stock-return-browser-20261128]
jobs:
  stock-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD HEAD^{tree}
          node --check web/scripts/v09-stock-return-browser.mjs
          node web/scripts/v09-stock-return-browser.mjs "$GITHUB_WORKSPACE"
