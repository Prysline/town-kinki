name: V07 independent stock tax HTTP (validation only)
on:
  push:
    branches: [validation/v07-stock-tax-http-20261128]
jobs:
  stock-tax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD HEAD^{tree}
          node --check web/scripts/v07-stock-tax-http.mjs
          node web/scripts/v07-stock-tax-http.mjs "$GITHUB_WORKSPACE"
