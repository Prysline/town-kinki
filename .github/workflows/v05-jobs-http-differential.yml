name: V05 independent work differential (validation only)
on:
  push:
    branches: [validation/v05-jobs-http-differential-20261128]
jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin and compare exact work versions
        run: |
          git rev-parse HEAD HEAD^{tree}
          git worktree add --detach "$RUNNER_TEMP/v05-base" c18f56e8df68f3c8998c1ba7733500026e34424b
          node web/scripts/v05-jobs-http-differential.mjs "$RUNNER_TEMP/v05-base" "$GITHUB_WORKSPACE"
